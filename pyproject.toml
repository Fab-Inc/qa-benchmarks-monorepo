[project]
name = "fab-benchmarks-monorepo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "mdformat>=1.0.0",
  "mdformat-gfm>=1.0.0",
  "pre-commit>=3.6.0",
  "pre-commit-hooks>=4.5.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "python-dotenv>=1.0.0",
  "ruff>=0.6.0",
]

[tool.uv]
required-version = ">=0.11.8"
# Ignore brand new dependency versions, for cybersecurity and robustness
exclude-newer = "7 days"

[tool.uv.workspace]
members = [
  "packages/fab_benchmark_publisher",
  "packages/primerpro",
  "packages/decodability",
  "benchmarks/phonics_benchmark",
  "benchmarks/linguistic_knowledge_benchmark",
]

[tool.uv.sources]
fab-benchmark-publisher = { workspace = true }
primerpro = { workspace = true }
decodability = { workspace = true }
fabdata-llm = { git = "https://github.com/AI-for-Education/fabdata-llm.git", rev = "main" }

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
markers = [
  "integration: requires real GCS credentials (opt-in, never run in CI)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/scripts/*" = ["F401"]
