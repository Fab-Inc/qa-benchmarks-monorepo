[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reading-comprehension-question-generation"
version = "0.1.0"
description = "Reading comprehension question generation benchmark package"
requires-python = ">=3.13"
dependencies = [
  "fab-benchmark-publisher",
  "fabdata-llm",
  "openpyxl>=3.1.5",
  "pandas>=2.0.0",
  "phonics-benchmark",
  "pydantic>=2.13.4",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
]

[project.scripts]
reading-comprehension-question-generation = "reading_comprehension_question_generation.cmd:main"
rcqg = "reading_comprehension_question_generation.cmd:main"
