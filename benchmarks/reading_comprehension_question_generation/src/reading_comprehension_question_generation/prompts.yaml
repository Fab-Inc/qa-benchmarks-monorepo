# Prompt templates for the rcqg benchmark, rendered with str.format().
#
# question_generation uses exactly three placeholders: {text} (the passage),
# {language} (the language name, such as English, that the questions and answers are
# written in), and {num_pairs} (how many question and answer pairs to ask for; the
# fixed constant NUM_PAIRS in prompts.py). No other field may reach the prompt.
# Literal braces are written doubled ({{ and }}) so str.format leaves them alone; braces
# inside the passage itself are safe because the passage is substituted as a value and
# is not parsed again.
#
# The blocks use YAML literal scalars (|-) so that line breaks are kept exactly.

question_generation: |-
  CONTEXT
  You are helping a teacher check whether early primary learners understand what they
  read. Read the passage below and write reading comprehension questions about it,
  each with its correct answer.

  TASK
  Write exactly {num_pairs} question and answer pairs about the passage.
  - Write the questions and the answers in {language}.
  - Every question must be answerable from the passage alone.
  - Keep each question and each answer short and clear, suitable for a young learner.
  - Do not repeat a question.

  OUTPUT FORMAT
  Return only a JSON array with exactly {num_pairs} objects, and nothing before or
  after it. Each object has two string keys, "question" and "answer", like this:
  [
    {{"question": "...", "answer": "..."}},
    {{"question": "...", "answer": "..."}}
  ]

  PASSAGE
  {text}
