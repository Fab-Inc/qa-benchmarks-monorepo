[project]
name = "language-knowledge-benchmark"
version = "0.1.0"
description = "Language knowledge benchmark package"
requires-python = ">=3.13"
dependencies = [
  "fab-benchmark-publisher",
  "typer>=0.12.0",
]

[project.scripts]
language-knowledge-benchmark = "language_knowledge_benchmark.cmd:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
