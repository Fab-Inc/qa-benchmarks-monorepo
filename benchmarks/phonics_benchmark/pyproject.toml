[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phonics-benchmark"
version = "0.1.0"
description = "Phonics benchmark package"
requires-python = ">=3.13"
dependencies = [
  "decodability",
  "fab-benchmark-publisher",
  "fabdata-llm",
  "pandas>=3.0.0",
  "pydantic>=2.13.4",
  "pyyaml>=6.0",
  "typer>=0.12.0",
]

[project.scripts]
phonics-benchmark = "phonics_benchmark.cmd:main"
