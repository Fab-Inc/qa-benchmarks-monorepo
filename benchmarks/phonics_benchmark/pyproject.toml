[project]
name = "phonics-benchmark"
version = "0.1.0"
description = "Phonics benchmark package"
requires-python = ">=3.12"
dependencies = [
  "fab-benchmark-publisher",
  "typer>=0.12.0",
]

[tool.uv.sources]
fab-benchmark-publisher = { workspace = true }

[project.scripts]
phonics-benchmark = "phonics_benchmark.cmd:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

