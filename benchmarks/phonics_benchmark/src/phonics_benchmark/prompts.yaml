# Prompt templates for the decodability benchmark.
# Templates use str.format() named placeholders like {my_variable}

# Prompts below use YAML folded scalars (>-): a single line break becomes a
# space; blank lines are preserved as newlines (N blank lines -> N newlines).
# So to get a blank line in the output, leave two blank lines in the source.

decodability_evaluation: >-
  You are helping a teacher to determine which words in a text a particular student
  cannot yet read aloud on their own.


  A word is "non-decodable" for a student when the student cannot read it based on what
  they currently know, neither by recognising it as a whole word they already know, nor
  by sounding it out from letter-sounds (graphemes) they have been taught.


  The text is in the language of {language}.


  The student knowledge profile is:

  {taught_knowledge}


  The text to evaluate is:

  {text}


  Your task is to reply with a list of unique non-decodable words, formatted in JSON
  array format exactly like this:

  `["word1", "word2", "word3"]`


  If all words are decodable, reply with an empty list like this:

  `[]`
