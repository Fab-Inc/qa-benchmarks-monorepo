# Template(s) below use str.format() named placeholders like {my_variable}
# and use YAML folded scalars (>-): a single line break becomes a
# space; blank lines are preserved as newlines (N blank lines -> N newlines).
# So to get a blank line in the output, leave two blank lines in the source.

decodable_text_generation: >-
  CONTEXT

  You are helping a teacher to write a text that a particular student can read
  aloud entirely on their own.


  A word is "decodable" for a student when the student can read it based on what
  they currently know. A word is "non-decodable" when they cannot.


  DECODING RULES

  A word is decodable for this student if EITHER of the following is true:


  1. The student already knows the word as a whole word, or

  2. ALL of the following hold:

  - every letter-sound (grapheme) in the word is one the student knows, AND

  - every consonant cluster in the word is one the student knows, either
  directly or through a cluster pattern they know.


  If neither condition holds, the word is non-decodable and you must not use it.

  Note that a word is non-decodable if even one of its graphemes or clusters is
  unknown to the student.


  The text must be written in the language of {language}.


  STUDENT KNOWLEDGE

  {student_knowledge}


  TASK

  {scenario}


  Every single word you write must be decodable for this student, according to
  the DECODING RULES above and the STUDENT KNOWLEDGE above. This constraint
  matters more than length, style or subject matter: if you must choose between
  writing a natural-sounding text and writing a fully decodable one, always
  choose the fully decodable one.


  Work within the student's knowledge rather than around it. Repeating words the
  student knows is acceptable and normal for an early reader.


  OUTPUT

  Respond with only the text itself, wrapped in text tags, exactly like this:

  <text>

  Your text goes here.

  </text>


  Do not include any explanation, reasoning, commentary, translation, word list
  or notes before, after or inside the tags. Do not explain your word choices.
