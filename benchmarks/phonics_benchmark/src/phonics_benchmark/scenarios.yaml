# Generation scenarios for the decodable-text-generation benchmark.
#
# Each entry is keyed by its scenario_id and holds the TASK instruction injected
# into the {scenario} placeholder of the decodable_text_generation prompt.
#
# Every scenario states its own length target so the task is well defined and
# comparable across models. Length is deliberately NOT scored (see scoring.py);
# it is recorded as a diagnostic only.
#
# Scenarios use YAML folded scalars (>-): a single line break becomes a space;
# blank lines are preserved as newlines (N blank lines -> N newlines).

words: >-
  Generate a list of 20 words for this student to practice reading.

  If there are not enough words in the language for this particular student to read, you may stop early.

sentences: >-
  Write 10 independent practice sentences for this student to read.

  Each sentence should stand on its own and does not need to connect to the others.

story: >-
  Write a short story of about 100 words for this student to read.

  The story should be interesting and age-appropriate for a child who is learning to read.