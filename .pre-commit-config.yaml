# Check uv lock first otherwise can pollute other tests.
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        require_serial: true
      - id: mdformat
        name: Format markdown files
        entry: uv run mdformat --wrap 88
        language: system
        types: [markdown]
      - id: check-added-large-files
        name: Check for added large files
        entry: uv run check-added-large-files
        language: system
      - id: check-toml
        name: Check TOML files
        entry: uv run check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: Check YAML files
        entry: uv run check-yaml
        language: system
        types: [yaml]
      - id: end-of-file-fixer
        name: Fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        description: Detect hardcoded secrets using Gitleaks
        entry: uv run gitleaks git --pre-commit --redact --staged --verbose
        language: golang
        pass_filenames: false
