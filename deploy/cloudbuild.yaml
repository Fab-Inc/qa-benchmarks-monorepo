steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/phonics.Dockerfile
      - --build-arg
      - CODE_GIT_HASH=${_CODE_GIT_HASH}
      - --build-arg
      - CODE_GIT_DIRTY=${_CODE_GIT_DIRTY}
      - --tag
      - ${_IMAGE_URI}
      - .

images:
  - ${_IMAGE_URI}
