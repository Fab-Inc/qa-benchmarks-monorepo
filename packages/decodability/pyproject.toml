[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decodability"
version = "0.1.0"
description = "Lightweight scaffolding for language-specific decodability tooling"
requires-python = ">=3.13"
dependencies = [
  "g2p-en>=2.1.0",
  "pandas>=2.0.0",
  "primerpro",
  "pydantic>=2.13.4",
  "pypdf>=6.14.2",
]
