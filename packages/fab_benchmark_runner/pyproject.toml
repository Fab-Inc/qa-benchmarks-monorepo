[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fab-benchmark-runner"
version = "0.1.0"
description = "Shared run machinery for FAB benchmarks: result IDs, model registry, GCS sync and Cloud Run deployment"
readme = "README.md"
# Legacy benchmark repositories still run on Python 3.12, so this package must not
# require 3.13 even though the monorepo itself does.
requires-python = ">=3.12"
dependencies = [
  "fabdata-llm",
  "google-cloud-storage>=2",
  "google-crc32c>=1.5",
  "pillow>=10",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
]

[project.scripts]
fab-bench = "fab_benchmark_runner.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

# The package is not a member of the monorepo's uv workspace: it has its own lock,
# resolved for Python 3.12 like the legacy benchmarks that install it.
[tool.uv]
required-version = ">=0.11.8"
# Ignore brand new dependency versions, for cybersecurity and robustness
exclude-newer = "7 days"

[tool.uv.sources]
fabdata-llm = { git = "https://github.com/AI-for-Education/fabdata-llm.git", rev = "dev" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
  "integration: requires real GCS credentials (opt-in, never run in CI)",
]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py312"
